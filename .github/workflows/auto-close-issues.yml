name: Auto Close Issues (Any Branch + PR)

on:
  push:
    branches:
      - '**'
      - '!main'          # main 交给 GitHub 内置机制
  pull_request:
    types: [closed]      # 仅在 PR 关闭/合并时兜底

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Parse and close issues
        uses: actions/github-script@v7
        with:
          script: |
            const regex = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const issues = new Set();
            let sourceDesc = '';

            if (context.eventName === 'push') {
              // ---- 来自 commit message ----
              const commits = context.payload.commits || [];
              for (const c of commits) {
                let m;
                while ((m = regex.exec(c.message)) !== null) {
                  issues.add(parseInt(m[3], 10));
                }
                regex.lastIndex = 0;   // 每条 commit 重置游标
              }
              const branch = context.ref.replace('refs/heads/', '');
              sourceDesc = `分支 \`${branch}\` 的提交`;

            } else if (context.eventName === 'pull_request') {
              // ---- 来自 PR 标题 + 描述，仅合并时 ----
              const pr = context.payload.pull_request;
              if (!pr.merged) {
                console.log('PR 未合并，跳过');
                return;
              }
              const text = `${pr.title}\n${pr.body || ''}`;
              let m;
              while ((m = regex.exec(text)) !== null) {
                issues.add(parseInt(m[3], 10));
              }
              sourceDesc = `PR #${pr.number}`;
            }

            if (issues.size === 0) {
              console.log('未发现需要关闭的 issue');
              return;
            }

            for (const num of issues) {
              try {
                // 先检查状态，已关闭就跳过，避免重复评论/通知
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num
                });
                if (issue.state === 'closed') {
                  console.log(`⏭️  #${num} 已关闭，跳过`);
                  continue;
                }

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  body: `🔒 由 ${sourceDesc} 自动关闭。`
                });

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  state: 'closed',
                  state_reason: 'completed'
                });

                console.log(`✅ Closed issue #${num}`);
              } catch (e) {
                console.error(`❌ #${num}: ${e.message}`);
              }
            }
